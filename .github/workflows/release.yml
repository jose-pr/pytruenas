name: Release

# Runs when a version tag (e.g. v0.1.0, v0.1.0-rc.1) is pushed. This is the
# release gate, not general CI. Publishing to PyPI uses Trusted Publishing
# (OIDC) -- PREREQUISITE: configure a "pypi" GitHub environment and register
# this repo as a trusted publisher for the `pytruenas` PyPI project first.
#
# Test and dependency-floor gates, build (checking that the tag names the
# version built), an installed-wheel smoke test, a strict docs build gate, the
# GitHub release, then -- for a final tag only, never a pre-release -- the PyPI
# upload and a dispatch of docs.yml at this tag. Pages is deployed by docs.yml,
# never here; the `github-pages` environment must allow tag refs for that
# deploy (`gh api -X POST repos/<org>/<repo>/environments/github-pages/deployment-branch-policies
# -f name='v*' -f type=tag`), or it is rejected after a green build.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.14"] # oldest + newest supported
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (dev, which carries every extra that has tests)
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q -rs

  # The same job test.yml runs: a release must hold at the lowest version of
  # every dependency the manifest claims to support.
  floors:
    name: Test at the declared dependency floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Pin every declared dependency to its floor
        shell: python
        run: |
          import re
          import subprocess
          import sys

          subprocess.run([sys.executable, "-m", "pip", "install", "-q", "tomli"], check=True)
          import tomli

          project = tomli.load(open("pyproject.toml", "rb"))["project"]
          specs = list(project.get("dependencies", []))
          for extra, deps in project.get("optional-dependencies", {}).items():
              if extra not in ("dev", "docs"):
                  specs += deps
          pins = []
          for spec in specs:
              m = re.match(r"^\s*([A-Za-z0-9._-]+)(\[[^\]]*\])?\s*[^;]*?>=\s*([^,;\s]+)", spec)
              if m:
                  pins.append("%s==%s" % (m.group(1), m.group(3)))
          pins = list(dict.fromkeys(pins))  # hostctl is required more than once
          open("floors.txt", "w").write("\n".join(pins) + "\n")
          print("\n".join(pins) or "(no floors declared)")
      - name: Install at the floors
        run: python -m pip install -c floors.txt -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q -rs

  build:
    name: Build distribution
    needs: [test, floors]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install build tooling
        run: python -m pip install --upgrade build twine packaging
      - name: Build sdist and wheel
        run: python -m build
      # A tag on the wrong commit would otherwise publish a release named for
      # one version that carries another version's artifacts.
      - name: The tag names the version that was built
        shell: python
        env:
          TAG: ${{ github.ref_name }}
        run: |
          import os
          import pathlib
          import sys

          from packaging.utils import parse_sdist_filename, parse_wheel_filename
          from packaging.version import Version

          tag = os.environ["TAG"]
          want = Version(tag[1:] if tag.startswith("v") else tag)
          dist = pathlib.Path("dist")
          built = {str(parse_wheel_filename(p.name)[1]) for p in dist.glob("*.whl")}
          built |= {str(parse_sdist_filename(p.name)[1]) for p in dist.glob("*.tar.gz")}
          if built != {str(want)}:
              sys.exit("tag %s is version %s, but dist/ holds %s" % (tag, want, sorted(built)))
          print("tag %s matches the built version %s" % (tag, want))
      - name: Verify sdist and wheel
        run: python -m twine check dist/*
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # What a user installs is the wheel, not the checkout: install it with no
  # extras into a clean environment, check it imports, carries the files it
  # must ship and runs its console script, then run the suite against it.
  wheel-smoke:
    name: Installed-wheel smoke test (py${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"] # oldest + newest supported
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install the wheel, with no extras, into a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install dist/*.whl pytest
      - name: Import it, find the files it must ship, run its console script
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/smoke/bin/python" - <<'PY'
          from importlib.resources import files

          import pytruenas

          root = files("pytruenas")
          for name in ("py.typed", "AGENTS.md", "README.md"):
              assert (root / name).is_file(), "the wheel does not ship %s" % name
          print("ok:", pytruenas.__version__, pytruenas.__file__)
          PY
          "$RUNNER_TEMP/smoke/bin/pytruenas" --version
      - name: Run the suite against the installed wheel
        # An empty pythonpath keeps the checkout's src/ off sys.path, so the
        # tests import the wheel.
        run: '"$RUNNER_TEMP/smoke/bin/python" -m pytest -q -rs -o pythonpath='

  # Docs are DEPLOYED by docs.yml. This job only GATES the release on a strict
  # docs BUILD: a release must never ship while the docs site is broken, but the
  # release path never deploys Pages itself.
  docs-gate:
    name: Docs build gate (strict, no deploy)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install package with docs tooling
        run: python -m pip install -e ".[dev,docs]"
      - name: Build docs (gate only)
        run: mkdocs build --strict

  github-release:
    name: Create GitHub Release
    needs: [build, docs-gate, wheel-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Extract CHANGELOG.md section for this tag
        shell: python
        # The tag reaches the script as data (an environment variable), never
        # spliced into its source.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          import os
          import pathlib
          import re
          import sys

          tag = os.environ["TAG"]
          version = tag[1:] if tag.startswith("v") else tag

          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]:\s|\Z)",
              changelog,
              re.DOTALL | re.MULTILINE,
          )
          if not match:
              sys.exit(f"No CHANGELOG.md section found for version {version!r}")
          pathlib.Path("release_notes.md").write_text(match.group(1).strip() + "\n", encoding="utf-8")
      - name: Create GitHub Release
        # Pinned to a commit: this action runs with contents: write.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          # Pin the release object to the tagged commit. Unset, it defaults to
          # the repository's default branch, so a release created before a
          # branch rename keeps pointing at a branch that no longer exists and
          # every later release fails with `Invalid target_commitish`.
          target_commitish: ${{ github.sha }}
          # A repo without a PR flow gets thin auto-generated "What's Changed"
          # notes; the scraped CHANGELOG section is the real body, and this
          # still appends the compare link.
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release_notes.md

  # After the GitHub release, and only for a final tag: a PyPI upload is
  # irreversible (a version can never be reused), a GitHub release is not.
  publish-pypi:
    name: Publish to PyPI
    needs: [build, github-release]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pytruenas/
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Re-running a partially completed release must not hard-fail on
          # files already uploaded (PyPI never replaces a version); publish
          # only what is missing. The build job's tag/version check keeps it
          # from masking a wrong tag.
          skip-existing: true

  # A release created with the workflow's own GITHUB_TOKEN starts no other
  # workflow, so docs.yml cannot listen for it; a workflow_dispatch is the
  # exception, and deploys the docs at this tag. A pre-release leaves the
  # published docs alone. Off the publish chain, so a Pages problem never
  # blocks a package that passed its tests.
  docs-deploy:
    name: Deploy the docs for this release
    needs: github-release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch docs.yml at this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
