name: Release

# Runs when a version tag (e.g. v0.1.0, v0.1.0-rc.1) is pushed. This is the
# release gate, not general CI. Publishing to PyPI uses Trusted Publishing
# (OIDC) -- PREREQUISITE: configure a "pypi" GitHub environment and register
# this repo as a trusted publisher for the `pytruenas` PyPI project first.
#
# Pages is deployed by docs.yml, not here: this workflow gates on a strict docs
# build and creates the release object, whose `published` event triggers that
# deploy. The `github-pages` environment must allow tag refs for it
# (`gh api -X POST repos/<org>/<repo>/environments/github-pages/deployment-branch-policies
# -f name='v*' -f type=tag`), or the deploy is rejected after a green build.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with all extras
        # No `host` extra: it was dropped when pytruenas.ops.host moved from
        # ifaddr to netimps (a core dependency). pip only warns on an unknown
        # extra, so this silently did nothing.
        run: python -m pip install -e ".[dev,config,ssh,codegen]"
      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install build tooling
        run: python -m pip install --upgrade build
      - name: Build sdist and wheel
        run: python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Docs are DEPLOYED by docs.yml, which this release triggers by publishing
  # its release object. This job only GATES: a release must not ship while the
  # docs site is broken, and it must not be able to fail *because* of Pages --
  # so nothing here touches Pages, and publish does not depend on it.
  docs-gate:
    name: Docs build gate (strict, no deploy)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install package with docs tooling
        run: python -m pip install -e ".[dev,docs,config,ssh,codegen]"
      - name: Build docs (gate only)
        run: mkdocs build --strict

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Extract CHANGELOG.md section for this tag
        shell: python
        run: |
          import pathlib
          import re
          import sys

          tag = "${{ github.ref_name }}"
          version = tag[1:] if tag.startswith("v") else tag

          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]:\s|\Z)",
              changelog,
              re.DOTALL | re.MULTILINE,
          )
          if not match:
              sys.exit(f"No CHANGELOG.md section found for version {version!r}")
          pathlib.Path("release_notes.md").write_text(match.group(1).strip() + "\n", encoding="utf-8")
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          # Pin the release object to the tagged commit. Unset, it defaults to
          # the repository's default branch, so a release created before a
          # branch rename keeps pointing at a branch that no longer exists and
          # every later release fails with `Invalid target_commitish`.
          target_commitish: ${{ github.sha }}
          # A repo without a PR flow gets thin auto-generated "What's Changed"
          # notes; the scraped CHANGELOG section is the real body, and this
          # still appends the compare link.
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release_notes.md

  publish-pypi:
    name: Publish to PyPI
    needs: github-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pytruenas/
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Re-running a partially completed release must not hard-fail on
          # files already uploaded (PyPI never replaces a version); publish
          # only what is missing.
          skip-existing: true
