[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytruenas"
version = "0.3.2"
authors = [{ name = "Jose A." }]
description = "A typed, Pythonic client and CLI for the TrueNAS middleware API"
readme = "README.md"
keywords = ["truenas", "middleware", "jsonrpc", "websocket", "sysadmin", "cli"]
requires-python = ">=3.9"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Filesystems",
    "Typing :: Typed",
]
dependencies = [
    # >=0.4.0: duho.runpath now carries register(base=...) (shared-root METHOD
    # inheritance, not just data fields), the __main__.py init/success/finally_
    # lifecycle, the corrected enable/!enable token spelling, and the Extend()
    # nested-list fix that flattens `--cmdspath a:b` to ['a','b']. Earlier fixes
    # (>=0.3.2: global option before subcommand not shadowed; '%' in a Cmd
    # docstring no longer crashes parser build; directly-built Cmd seeds field
    # defaults) are subsumed.
    # >=0.4.1: a module command may declare its own `Args` class (fields added
    # to the subparser before register() runs), so cmd/*.py declare their CLI
    # fields instead of hand-syncing an inert Args class against an imperative
    # register(); and the register hook is gated/introspected on the object
    # actually called, which is what lets main._with_targets wrap
    # ModuleCommand.register to add the shared trailing targets positional
    # app-wide -- including for a command that defines no register of its own.
    # >=0.5.0 (BREAKING in duho itself, not here): a list/set/tuple field used
    # as an OPTION (call.py's -p/--param, query.py's -f/--filter) now takes one
    # value per occurrence by default (`-f a -f b`, action="append",
    # nargs=None) instead of space-separated multi-value in one occurrence
    # (`-f a b`, nargs="*") -- cmd/*.py no longer pin an explicit
    # NS(action=..., nargs=...) override to get that. 0.5.0 also shipped a
    # flag-between-positionals reorder fix, but it only covered duho's own
    # declarative subcommand tree, not a module command's subparser (this
    # project's entire command set) -- fixed in 0.5.1, which extends the same
    # reorder to a module command's subparser too, so e.g.
    # `pytruenas call method -p '{"a":1}' nas1` (flag BETWEEN the method and
    # the trailing targets) now parses; earlier duho required the flag before
    # the method or after the targets. See the duho findings
    # 2026-07-24_optional_between_positional_groups_breaks_trailing_nargs_star.md
    # and 2026-07-24_module_command_subparsers_bypass_positional_reorder.md for
    # the history. Validated on 0.5.1.
    "duho>=0.5.1",
    # Network utilities. >=0.0.2 for the built-in scheme->port table, which is
    # what resolves ws/wss: no system services database knows those schemes, so
    # getservbyname raises and a websocket URL would otherwise carry port 0.
    # `get_default_port` in utils/target.py is the ONLY thing used from this
    # package. (It also once backed the adapter discovery in pytruenas.ops.host,
    # replacing ifaddr; that module is gone, but the scheme table alone keeps
    # this a core dependency.)
    # Capped below 0.3: netimps is 0.x, where a minor bump may break -- 0.2.0
    # reworked resolve() and made dnspython optional. Neither touches
    # get_default_port. Validated on 0.2.0.
    "netimps>=0.0.2,<0.3",
    # >=0.8.2: SftpPath importable/usable without paramiko (asyncssh-only). The
    # 'uri' extra (uritools) is needed by TnasWsPath/TruenasPath, which are
    # UriPaths.
    # >=0.9.0: `UriPath.__fspath__` returns the host-local path for a scheme
    # marked `_host_filesystem_path` (TnasWsPath/TruenasPath set it) instead of
    # raising for every non-`file` scheme, so `os.fspath()` is the one way to
    # name a remote path in a command line -- `patch.zfs.host_path` relies on
    # it rather than unwrapping the URI by hand. 0.9.0 also stopped
    # `Source.__str__`/`__repr__` leaking the password, which matters because
    # `repr` is what a traceback frame renders. Both came from findings filed
    # here. Capped below 0.10: pathlib_next is 0.x, where a minor bump may
    # break. Validated on 0.9.0.
    "pathlib_next[uri]>=0.9.0,<0.10",
    "requests",
    "websocket-client",
    # Generic host machinery: TrueNASHost is a hostctl PosixHost, and run()/
    # path() are inherited from it. A hard import in pytruenas.host,
    # pytruenas.providers, and pytruenas.webshell -- not optional.
    #
    # >=0.1.0 is the first release, and everything this depends on landed in
    # it: `ssh_providers`/`winrm_providers` (composing SSH into a non-
    # SystemConfig host without importing privates), `normalize_input` (a
    # bytes `input=` with a text `encoding=` otherwise deadlocks the call), the
    # `uri_credentials` fail-closed check, and the exported URI helpers.
    # >=0.1.2: `uri_hostname()` -- the host as *written*, not as urlsplit
    # case-folded it. Both this and the 0.1.1 fix it completes came out of a
    # finding filed from here (2026-07-28_redact_uri_case_folds_the_hostname):
    # 0.1.1 stopped `redact_uri`'s rebuild from folding, which had made one
    # machine render two ways depending on whether the URI carried a password;
    # 0.1.2 exported the helper so a config stores the typed spelling in the
    # first place. `TrueNASConfig` uses it for `host`, which `name` and
    # `connection_uri` render back out -- without it a `nasA` fan-out logs
    # `[nasa]`. NOTE the deliberate trade-off it carries: `.host` is the given
    # spelling, not a canonical one, so two spellings of one machine are not
    # equal configs (routing still case-folds; only display keeps the case).
    # Ceiling raised to <0.3 for hostctl 0.2.x: 0.2.1 added ConnectionString
    # (from a finding filed here) and 0.2.2 widened its own dependency ranges
    # to admit pathlib_next 0.9 / netimps 0.2 -- which pathlib_next 0.9's `uri`
    # extra requires, so the old `<0.2` cap made the four packages
    # unresolvable together. Nothing pytruenas imports changed; every symbol it
    # uses is still present. The floor stays at 0.1.2 rather than rising: none
    # of the 0.2 API is used here, and demanding a version the code does not
    # need would exclude working installs. Validated on 0.2.2.
    "hostctl>=0.1.2,<0.3",
]

[project.optional-dependencies]
# Config-file support for the CLI (YAML targets/config).
config = ["pyyaml"]
# Remote shell + SFTP filesystem leg (asyncssh via pathlib_next's sftp-async).
# >=0.8.3: AsyncsshSftpBackend default concurrency 8->16 (faster recursive SFTP).
ssh = ["asyncssh", "pathlib_next[sftp-async]>=0.9.0,<0.10"]
# Typings generator (`pytruenas generate-typings`).
codegen = ["jinja2"]
# NOTE: there is no 'host' extra. It installed ifaddr for pytruenas.ops.host's
# adapter discovery; that moved to netimps (a core dependency) and the module
# has since been removed entirely. Nothing to install, nothing to add back.
dev = ["black", "build", "hatchling", "pytest", "pytest-cov", "twine", "pyyaml", "asyncssh", "jinja2"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

[project.scripts]
pytruenas = "pytruenas.main:main"

[project.urls]
Homepage = "https://github.com/jose-pr/pytruenas/"
Issues = "https://github.com/jose-pr/pytruenas/issues"
Repository = "https://github.com/jose-pr/pytruenas"


# Ship the consumer-facing docs inside the installed package, so they are
# readable from site-packages via importlib.resources without the repo.
# src/pytruenas/AGENTS.md is included automatically by living in the package
# dir; the repo-root AGENTS.md is development-only and deliberately not
# shipped.
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "pytruenas/README.md"

[tool.hatch.build.targets.sdist]
# `/.*` already covers every dot-entry at the root -- .agents, .github, .venv,
# .pytest_cache, .coverage. (.gitignore still ships: hatchling includes it for
# sdists by design, so the archive reproduces the source tree.)
exclude = ["/.*"]

[tool.hatch.build.targets.wheel]
packages = ["src/pytruenas"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# Pinned to the *floor* (requires-python = ">=3.9"), not the interpreter used
# for dev: black must never emit syntax 3.9 cannot parse, and routine work now
# happens on 3.14 where such a mistake would go unnoticed until the floor check.
[tool.black]
target-version = ["py39"]
