[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license fields need 1.27
build-backend = "hatchling.build"

[project]
name = "pytruenas"
version = "0.7.0"
authors = [{ name = "Jose A." }]
description = "A typed, Pythonic client and CLI for the TrueNAS middleware API"
readme = "README.md"
keywords = ["truenas", "middleware", "jsonrpc", "websocket", "sysadmin", "cli"]
requires-python = ">=3.9"
# PEP 639: an SPDX expression plus the files themselves. The legacy
# `License ::` classifier is gone -- carrying both is an error for modern
# build backends and installers.
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Filesystems",
    "Typing :: Typed",
]
dependencies = [
    # Ranges follow one rule: a 0.x dependency is capped below its next minor
    # (where 0.x may break) and floored at the base of the series unless this
    # package's own code needs an API from a later patch -- then the comment
    # names that API and patch. 1.x+ dependencies are major-scoped. Version
    # history lives in CHANGELOG.md, not here.
    # Series base; the 0.5.2-era `runpath.register(step_adapter=...)` need is
    # long satisfied. Verified against the released 0.6.0 wheel: every
    # documented [minor] break checked against actual usage and the full test
    # suite on both interpreters, none apply. 0.6.0 also adds opt-in
    # MCP-over-stdio launch (`PYTRUENAS_MCP=stdio`); not opted out, see
    # "Environment variables" in src/pytruenas/AGENTS.md.
    "duho>=0.7.7,<0.8",
    # Series base; only `get_default_port` (utils/target.py) is used.
    "netimps>=0.4.0,<0.5",
    # hostctl 0.4.0 requires 0.1.2; `LocalPath`, `FileStat`, `CommitOnClose`.
    "pathapi>=0.1.2,<0.2",
    # Series base; import name `uripath`. `URIPath` is the base of the
    # `truenas://` and `truenas+ws://` path types.
    "pathapi-uri>=0.1.0,<0.2",
    # 2.32.3: below it the side channels drop the adapter's SSLContext.
    "requests>=2.32.3,<3",
    # 2.0.2: below it the shared context fails on an IP-address target.
    "urllib3>=2.0.2,<3",
    # 1.3.3: below 1.2.2 `sslopt["context"]` is ignored, so the shared context
    # (truststore, a CA bundle, a caller's client certificate) never applies;
    # below 1.3.3 a refused connection leaves its socket open.
    "websocket-client>=1.3.3,<2",
    # verify=True checks through the platform verifier, as hostctl's does;
    # 0.10.5 is the range hostctl declares. It needs Python 3.10.
    'truststore>=0.10.5,<0.11; python_version >= "3.10"',
    # Series base. TrueNASClient is a hostctl PosixHost; every path a provider
    # returns must be a pathapi path. `deploy` is a built-in command and runs
    # on `hostctl.deploy`, whose extra brings packaging and pathspec (and tomli
    # below Python 3.11).
    "hostctl[deploy]>=0.4.0,<0.5",
    # The CLI's config file. 0.15.0: its `cfg` format reads the format a
    # `#!<format>` line names, else TOML, and it brings tomli below 3.11.
    "anycfg>=0.15.0,<0.16",
]

[project.optional-dependencies]
# A CLI config file written in YAML (`#!yaml`, `.yaml`/`.yml`).
yaml = ["anycfg[yaml]>=0.15.0,<0.16"]
# Remote shell + SFTP filesystem leg: both SSH providers are hostctl's (its
# `ssh` extra is asyncssh and sftppath).
ssh = ["hostctl[ssh]>=0.4.0,<0.5"]
# Every extra that has tests, by reference so the ranges live in one place.
dev = [
    "pytruenas[yaml,ssh]",
    "black",
    "build",
    "hatchling",
    "pytest",
    "pytest-cov",
    "twine",
    # tests/test_codegen_typecheck.py checks the generated stubs with both.
    "pyright",
    "mypy; python_version >= '3.10'",
    # The tests' throwaway certificate authority (real TLS handshakes).
    "sslcontext>=2.0.0,<3",
]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

[project.scripts]
pytruenas = "pytruenas.cli:main"

[project.urls]
Homepage = "https://github.com/jose-pr/pytruenas/"
Documentation = "https://jose-pr.github.io/pytruenas/"
Issues = "https://github.com/jose-pr/pytruenas/issues"
Repository = "https://github.com/jose-pr/pytruenas"


# Ship the consumer-facing docs inside the installed package, so they are
# readable from site-packages via importlib.resources without the repo.
# src/pytruenas/AGENTS.md is included automatically by living in the package
# dir; the repo-root AGENTS.md is development-only and deliberately not
# shipped.
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "pytruenas/README.md"

[tool.hatch.build.targets.sdist]
# `/.*` covers every dot-entry at the root (.github, .venv, .pytest_cache,
# .coverage, private tool directories). The repo-root AGENTS.md orients a
# contributor in a checkout and benchmarks/ is a development tool; neither is
# part of the source a consumer builds from. .gitignore still ships: hatchling
# includes it in an sdist by design.
#
# `*.local.*` (personal overrides) and `CLAUDE*` (agent config) match at any
# depth, so they stay out even of a tree copied without its .gitignore. A
# dotfile pattern does NOT match `AGENTS.local.md`, which sits beside the
# `AGENTS.md` that is meant to ship.
exclude = ["/.*", "/AGENTS.md", "/benchmarks", "*.local.*", "CLAUDE*"]

[tool.hatch.build.targets.wheel]
packages = ["src/pytruenas"]
exclude = ["*.local.*", "CLAUDE*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# A warning fails the test that raised it; an exception goes here, narrow.
filterwarnings = ["error"]
# An expected failure that starts passing fails, so its marker comes out.
xfail_strict = true

# Pinned to the *floor* (requires-python = ">=3.9"), not the interpreter used
# for dev: black must never emit syntax 3.9 cannot parse, and routine work now
# happens on 3.14 where such a mistake would go unnoticed until the floor check.
[tool.black]
target-version = ["py39"]
