[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytruenas"
version = "0.5.2"
authors = [{ name = "Jose A." }]
description = "A typed, Pythonic client and CLI for the TrueNAS middleware API"
readme = "README.md"
keywords = ["truenas", "middleware", "jsonrpc", "websocket", "sysadmin", "cli"]
requires-python = ">=3.9"
# PEP 639: an SPDX expression plus the files themselves. The legacy
# `License ::` classifier is gone -- carrying both is an error for modern
# build backends and installers.
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Filesystems",
    "Typing :: Typed",
]
dependencies = [
    # Ranges follow one rule: a 0.x dependency is capped below its next minor
    # (where 0.x may break) and floored at the base of the series unless this
    # package's own code needs an API from a later patch -- then the comment
    # names that API and patch. 1.x+ dependencies are major-scoped. Version
    # history lives in CHANGELOG.md, not here.
    # 0.5.2: `runpath.register(step_adapter=...)`, passed by main.py at import.
    "duho>=0.5.2,<0.6",
    # Series base; only `get_default_port` (utils/target.py) is used.
    "netimps>=0.3.0,<0.4",
    # 0.9.10: `Path._same_filesystem()`, the hook hostctl 0.3's composite paths
    # answer (and the minimum hostctl 0.3 itself requires).
    "pathlib_next[uri]>=0.9.10,<0.10",
    "requests>=2.0,<3",
    "websocket-client>=1.0,<2",
    # 0.3.2: `redact_uri` leaves a well-formed URI alone, which this package's
    # own redaction and its "does this target parse?" check both rely on (0.3.1
    # rewrote `ssh://nas:22/mail/user@example.com` into a different host). 0.3.1
    # brought the composite-path fallback when SFTP cannot connect and stopped
    # re-dialling a declined SSH leg. TrueNASHost is a hostctl PosixHost.
    "hostctl>=0.3.2,<0.4",
    # `deploy` reads PEP 508 requirement lines and environment markers to build
    # its dependency closure; without it the closure silently lost duho,
    # hostctl and netimps. Capped above the newest tested (26.x) rather than at
    # the next major as the rule says: packaging bumps its major every release,
    # so a major-scoped cap would pin one calendar year. Floor 21.3 is where
    # `Requirement`/`markers` took their current shape.
    "packaging>=21.3,<27",
]

[project.optional-dependencies]
# Config-file support for the CLI (YAML targets/config).
config = ["pyyaml"]
# Remote shell + SFTP filesystem leg: the SSH providers are hostctl's, so its
# own `ssh` extra (asyncssh, pathlib_next's sftp-async) is exactly what is needed.
ssh = ["hostctl[ssh]>=0.3.2,<0.4"]
# Typings generator (`pytruenas generate-typings`).
# Series base: `Environment`/`DictLoader`/`tojson` have been stable since 3.0,
# and 4.x may break them. Validated against 3.1.x.
codegen = ["jinja2>=3.0,<4"]
# Repo-tree bundling (`pytruenas deploy --source repo`): gitignore-style
# filtering via pathspec's GitWildMatch (accurate on `**`/negation, which a
# hand-rolled matcher gets wrong at the edges), and a parser for
# pyproject.toml's [project] table on interpreters below 3.11, where stdlib
# tomllib does not exist yet. tomli is version-gated rather than unconditional
# so 3.11+ never installs a redundant package for what it already has built
# in -- `pytruenas.utils.bundle` tries tomllib first regardless.
repo = ["pathspec", "tomli; python_version<'3.11'"]
dev =["black", "build", "hatchling", "pytest", "pytest-cov", "twine", "pyyaml", "hostctl[ssh]>=0.3.2,<0.4", "jinja2", "pathspec", "tomli; python_version<'3.11'"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

[project.scripts]
pytruenas = "pytruenas.main:main"

[project.urls]
Homepage = "https://github.com/jose-pr/pytruenas/"
Issues = "https://github.com/jose-pr/pytruenas/issues"
Repository = "https://github.com/jose-pr/pytruenas"


# Ship the consumer-facing docs inside the installed package, so they are
# readable from site-packages via importlib.resources without the repo.
# src/pytruenas/AGENTS.md is included automatically by living in the package
# dir; the repo-root AGENTS.md is development-only and deliberately not
# shipped.
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "pytruenas/README.md"

[tool.hatch.build.targets.sdist]
# `/.*` covers every dot-entry at the root (.github, .venv, .pytest_cache,
# .coverage, private tool directories). .gitignore still ships: hatchling
# includes it for sdists by design, so the archive reproduces the source tree.
#
# `*.local.*` is separate on purpose and matches at any depth: a dotfile
# pattern does NOT match `AGENTS.local.md`, whose name does not start with a
# dot -- and it sits in the same directory as the `AGENTS.md` that is meant to
# ship. Same directory, nearly the same name, opposite destinations.
exclude = ["/.*", "*.local.*"]

[tool.hatch.build.targets.wheel]
packages = ["src/pytruenas"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# Pinned to the *floor* (requires-python = ">=3.9"), not the interpreter used
# for dev: black must never emit syntax 3.9 cannot parse, and routine work now
# happens on 3.14 where such a mistake would go unnoticed until the floor check.
[tool.black]
target-version = ["py39"]
